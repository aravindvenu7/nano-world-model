name: nanowm
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
    # PyTorch from pip (CUDA 12.6 wheels). lerobot 0.3.3 needs torch<2.8 and torchvision>=0.21.
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.7.1
    - torchvision==0.22.1

    # Core ML
    - numpy<2  # pytorch-lightning 1.9.5 uses np.Inf, removed in numpy 2
    - scipy
    - Pillow
    - tqdm
    - requests

    # PyTorch ecosystem
    - timm
    - einops
    - lpips
    - piqa
    - pytorch-lightning==1.9.5
    - torchmetrics

    # Diffusion / generative
    - diffusers[torch]==0.33.1  # lerobot 0.3.3 needs diffusers>=0.27.2
    - accelerate
    - transformers

    # Config & experiment management
    - omegaconf
    - hydra-core
    - tensorboard
    - wandb

    # Data & datasets
    - lerobot==0.3.3
    - huggingface-hub<1.0  # lerobot 0.3.3 targets hub 0.x
    - decord
    - h5py
    - pandas

    # Image & video processing
    - opencv-python
    - imageio
    - imageio-ffmpeg
    - moviepy==1.0.3
    - scikit-image
    - av

    # Evaluation metrics
    - pytorch-fid
    - matplotlib
    - seaborn

    # Misc
    - sentencepiece
    - beautifulsoup4
    - ftfy
    - protobuf==4.25.3

    # BuilderBench online RL (src/builderbench, src/online_rl). JAX runs on the CPU, so no CUDA jaxlib.
    - mujoco>=3.3.6
    - mujoco-mjx>=3.3.6
    - jax>=0.6.2
    - optax
    - flax
    - etils
    - ml_collections
