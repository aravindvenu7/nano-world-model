hydra:
  run:
    dir: ${results_dir}/${now:%Y%m%d_%H%M%S}-${model.name}-F${model.num_frames}S${dataset.frame_interval}-${dataset.name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - dataset=mt50/mt50
    - model=nanowm_b2
    - logger.name=tensorboard
    - experiment.evaluation.metrics.evaluate=false
    - experiment.infra.num_workers=4
    - experiment.training.optimizer.lr=2e-4
    - experiment.training.max_steps=100000
    - experiment.training.checkpointing.across_timesteps.save_top_k=1
    - experiment.training.gradient_clip_start_step=0
  job:
    name: main_occupancy
    chdir: true
    override_dirname: dataset=mt50/mt50,experiment.evaluation.metrics.evaluate=false,experiment.infra.num_workers=4,experiment.training.checkpointing.across_timesteps.save_top_k=1,experiment.training.gradient_clip_start_step=0,experiment.training.max_steps=100000,experiment.training.optimizer.lr=2e-4,logger.name=tensorboard,model=nanowm_b2
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /home/ndarosa/nano-world-model
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ndarosa/nano-world-model/src/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ndarosa/nano-world-model/results/20260720_173730-NanoWM-B-2-F4S1-mt50
    choices:
      planning: base
      experiment: default
      dataset: mt50/mt50
      latent_codec: sd_vae
      model: nanowm_b2
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: disabled
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
